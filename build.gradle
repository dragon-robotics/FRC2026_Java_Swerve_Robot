plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
    id "io.freefair.lombok" version "8.4"
    id 'com.diffplug.spotless' version '6.20.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                    jvmArgs.add("-XX:+UnlockExperimentalVMOptions")
                    jvmArgs.add("-XX:GCTimeRatio=5")
                    jvmArgs.add("-XX:+UseSerialGC")
                    jvmArgs.add("-XX:MaxGCPauseMillis=50")

                    // The options below may improve performance, but should only be enabled on the RIO 2

                    final MAX_JAVA_HEAP_SIZE_MB = 100;
                    jvmArgs.add("-Xmx" + MAX_JAVA_HEAP_SIZE_MB + "M")
                    jvmArgs.add("-Xms" + MAX_JAVA_HEAP_SIZE_MB + "M")
                    jvmArgs.add("-XX:+AlwaysPreTouch")
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false // Change to true to delete files on roboRIO that no
                    // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.
wpi.java.debugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // WPILib/PathPlanner simulation tests carry process-global state such as
    // AutoBuilder configuration. Fork each test class so filtered integration
    // runs like `--tests frc.robot.subsystems.vision.*` match visionStabilityTest.
    forkEvery = 1
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    def strategyOrder = System.getProperty('vision.photon.strategyOrder')
    if (strategyOrder != null) {
        systemProperty 'vision.photon.strategyOrder', strategyOrder
    }
    def applyCoplanarPenalty = System.getProperty('vision.applyCoplanarPenalty')
    if (applyCoplanarPenalty != null) {
        systemProperty 'vision.applyCoplanarPenalty', applyCoplanarPenalty
    }
    def tagDistanceConfidenceMode = System.getProperty('vision.tagDistanceConfidenceMode')
    if (tagDistanceConfidenceMode != null) {
        systemProperty 'vision.tagDistanceConfidenceMode', tagDistanceConfidenceMode
    }
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    from sourceSets.main.allSource
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// Standalone vision/odometry stability regression tests. NOT wired into build/check —
// run explicitly with: ./gradlew visionStabilityTest
tasks.register('visionStabilityTest', Test) {
    group = 'verification'
    description = 'Runs the vision/odometry stability regression tests (frc.robot.subsystems.vision.*).'
    useJUnitPlatform()
    // PathPlanner AutoBuilder is process-global state; fork each class to avoid
    // cross-class contamination in integration-style sim tests.
    forkEvery = 1
    filter {
        includeTestsMatching 'frc.robot.subsystems.vision.*'
    }
    def strategyOrder = System.getProperty('vision.photon.strategyOrder')
    if (strategyOrder != null) {
        systemProperty 'vision.photon.strategyOrder', strategyOrder
    }
    def applyCoplanarPenalty = System.getProperty('vision.applyCoplanarPenalty')
    if (applyCoplanarPenalty != null) {
        systemProperty 'vision.applyCoplanarPenalty', applyCoplanarPenalty
    }
    def tagDistanceConfidenceMode = System.getProperty('vision.tagDistanceConfidenceMode')
    if (tagDistanceConfidenceMode != null) {
        systemProperty 'vision.tagDistanceConfidenceMode', tagDistanceConfidenceMode
    }
    testLogging {
        showStandardStreams = true
        events 'passed', 'skipped', 'failed'
    }
}
wpi.java.configureTestTasks(tasks.named('visionStabilityTest').get())

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
def venvPython = isWindows ? file('.venv/Scripts/python.exe') : file('.venv/bin/python3')
def pythonExecutable = System.getenv('PYTHON') ?: (venvPython.exists() ? venvPython.absolutePath : (isWindows ? 'python' : 'python3'))
def mirrorScriptPath = 'scripts/mirror_pathplanner_autos.py'
def pathplannerAutosDir = file('src/main/deploy/pathplanner/autos')
def pathplannerPathsDir = file('src/main/deploy/pathplanner/paths')
def pathplannerNavgrid = file('src/main/deploy/pathplanner/navgrid.json')

def leftAutos = fileTree(pathplannerAutosDir) {
    include '*.auto'
    include '*LTrench*.auto'
    include '*LT*.auto'
    include '*S1*.auto'
    include '*left*.auto'
    include '*Left*.auto'
    exclude '*Right*.auto'
    exclude '*right*.auto'
    exclude '*RTrench*.auto'
    exclude '*RT*.auto'
    exclude '*S7*.auto'
}

def leftPaths = fileTree(pathplannerPathsDir) {
    include '*.path'
    include '*LTrench*.path'
    include '*LT*.path'
    include '*S1*.path'
    include '*left*.path'
    include '*Left*.path'
    exclude '*Right*.path'
    exclude '*right*.path'
    exclude '*RTrench*.path'
    exclude '*RT*.path'
    exclude '*S7*.path'
}

def rightAutos = fileTree(pathplannerAutosDir) {
    include '*.auto'
    include '*Right*.auto'
    include '*right*.auto'
    include '*RTrench*.auto'
    include '*RT*.auto'
    include '*S7*.auto'
}

def rightPaths = fileTree(pathplannerPathsDir) {
    include '*.path'
    include '*Right*.path'
    include '*right*.path'
    include '*RTrench*.path'
    include '*RT*.path'
    include '*S7*.path'
}

tasks.register('mirrorAutos', Exec) {
    group = 'automation'
    description = 'Generate and update right-side PathPlanner autos and paths from canonical left-side assets.'
    workingDir = projectDir
    commandLine pythonExecutable, mirrorScriptPath

    // Re-run when canonical left assets change; produced right assets are outputs.
    inputs.files(leftAutos, leftPaths)
    inputs.file(pathplannerNavgrid)
    inputs.file(file(mirrorScriptPath))
    outputs.files(rightAutos, rightPaths)
}

tasks.register('checkMirroredAutos', Exec) {
    group = 'verification'
    description = 'Validate that generated right-side PathPlanner autos and paths match the canonical left-side assets.'
    workingDir = projectDir
    commandLine pythonExecutable, mirrorScriptPath, '--check'
}

tasks.named('build') {
    dependsOn tasks.named('mirrorAutos')
}

spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude '**/build/**', '**/build-*/**', '**/bin/**'
        }
        toggleOffOn()
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
    groovyGradle {
        target fileTree('.') {
            include '**/*.gradle'
            exclude '**/build/**', '**/build-*/**'
        }
        greclipse()
        indentWithSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }
    format 'xml', {
        target fileTree('.') {
            include '**/*.xml'
            exclude '**/build/**', '**/build-*/**'
        }
        eclipseWtp('xml')
        trimTrailingWhitespace()
        indentWithSpaces(2)
        endWithNewline()
    }
    format 'misc', {
        target fileTree('.') {
            include '**/*.md', '**/.gitignore'
            exclude '**/build/**', '**/build-*/**'
        }
        trimTrailingWhitespace()
        indentWithSpaces(2)
        endWithNewline()
    }
}

def mirrorAutosTask = tasks.named('mirrorAutos')
tasks.matching { Task task ->
    task.name in [
        'spotlessJava',
        'spotlessGroovyGradle',
        'spotlessXml',
        'spotlessMisc'
    ]
}.configureEach {
    dependsOn mirrorAutosTask
}
